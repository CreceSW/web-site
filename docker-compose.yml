version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crecesw-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.crecesw.description=CreceSW Website"
      - "com.crecesw.version=1.0"

networks:
  default:
    name: crecesw-network
